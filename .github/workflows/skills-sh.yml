# Confirms that the skills CLI behind skills.sh discovers every skill this
# repository distributes. Read-only; telemetry is disabled so CI runs do not
# count as installs on skills.sh.

name: skills.sh discovery

on:
  pull_request: {}
  workflow_dispatch: {}

permissions: {}

jobs:
  discover:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.20.0'
          cache: pnpm
      - name: Install locked tooling without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify skills CLI discovery
        env:
          DISABLE_TELEMETRY: '1'
        run: pnpm skills:discover
