# check-skills.yml — copied by `intent maintainer setup` into .github/workflows/
#
# Validates intent skills and recorded source reviews on pull requests. After a
# release or manual run, writes a read-only report when guidance needs review.
# This repository deliberately keeps analysis read-only and has no publisher job.
#
# The steps live in TanStack/intent's reusable workflows, pinned below to the
# commit of the Intent release that copied this file. Dependabot and Renovate
# bump the pin like any other action reference; a `github-actions` entry in
# .github/dependabot.yml is enough. Each job grants only the permissions its
# workflow needs, and Intent runs from this repository's own lockfile-pinned
# copy of @tanstack/intent.
#
# intent-workflow-version: 6
#
# Template variables (replaced by `intent setup`):
#   @zephyrcloudio/skills — e.g. @tanstack/query or my-workspace workspace
#   3cf6c146aa36288fba6bc5b7190413d878706756 # v0.5.0 — the immutable commit packaged with this Intent release

name: Check Skills

on:
  pull_request: {}
  release:
    types: [published]
  workflow_dispatch: {}

permissions: {}

jobs:
  validate:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: TanStack/intent/.github/workflows/check-skills.yml@3cf6c146aa36288fba6bc5b7190413d878706756 # v0.5.0
    with:
      artifacts: 'skills/_artifacts'
      repair: true
      node-version: '24.20.0'

  review:
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
    uses: TanStack/intent/.github/workflows/review-skills.yml@3cf6c146aa36288fba6bc5b7190413d878706756 # v0.5.0
    with:
      package-label: '@zephyrcloudio/skills'
      node-version: '24.20.0'
